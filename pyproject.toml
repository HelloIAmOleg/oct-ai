[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octai-reproducibility"
version = "0.1.0"
description = "Code and pseudonymized fold assignments for OCT classification experiments"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
include = ["octai*", "third_party*"]
